name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      release:
        description: "Also build a signed release APK (needs keystore secrets)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to publish the GitHub Release the in-app updater reads

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      UPDATE_REPO: ${{ github.repository }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No gradle-wrapper.jar needed in the repo: this action installs Gradle itself
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compute version name
        run: |
          N=${{ github.run_number }}
          echo "VERSION_NAME=$((1 + N / 100)).$(((N / 10) % 10)).$((N % 10))" >> "$GITHUB_ENV"

      - name: Download Sora font (optional)
        run: bash scripts/get-font.sh

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "No KEYSTORE_BASE64 secret - release will use the debug key"
          fi

      # Release = R8-optimised: much smoother than debug (Compose is slow in debug builds). Use this one.
      - name: Build release APK
        continue-on-error: true
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then unset KEYSTORE_PATH; fi
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/AviatorHOC-v${{ env.VERSION_NAME }}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/AviatorHOC-v${{ env.VERSION_NAME }}-release.apk"
            # fixed name -> stable README link: .../releases/latest/download/AviatorHOC-latest.apk
            cp app/build/outputs/apk/release/app-release.apk "out/AviatorHOC-latest.apk"
          fi

      # In-app updater: publish the release APK as a GitHub Release (tag build-N, N = versionCode).
      # Only when a real keystore is configured - debug-key builds can't update each other.
      - name: Publish release for in-app updates
        if: ${{ github.event_name != 'pull_request' && env.HAS_KEYSTORE == 'true' && hashFiles('app/build/outputs/apk/release/app-release.apk') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: v${{ env.VERSION_NAME }}
          body: ${{ github.event.head_commit.message }}
          files: |
            out/AviatorHOC-v${{ env.VERSION_NAME }}-release.apk
            out/AviatorHOC-latest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AviatorHOC-apk-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/
